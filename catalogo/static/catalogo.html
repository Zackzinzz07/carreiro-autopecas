<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Carreiro Auto Peças</title>
    <link rel="stylesheet" href="catalogo.css">
    <style>
        .search-box {
            margin: 20px 0;
            display: flex;
            gap: 10px;
        }
        .search-box input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        .search-box button {
            padding: 10px 20px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
        }
        .error {
            background: #fee;
            color: #c00;
            padding: 20px;
            border-radius: 4px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Catálogo - Carreiro Auto Peças</h1>

        <div class="search-box">
            <input type="text" id="search" placeholder="Buscar por descrição, código, categoria...">
            <button onclick="buscar()">Buscar</button>
        </div>

        <div id="loading" class="loading">Carregando catálogo...</div>
        <div id="error" class="error" style="display:none;"></div>
        <div id="produtos" class="produtos-grid"></div>
    </div>

    <script>
        let catalogo = null;

        async function carregar() {
            try {
                const resp = await fetch('catalogo.json');
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                catalogo = await resp.json();
                document.getElementById('loading').style.display = 'none';
                mostrarTodos();
            } catch (e) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = `Erro ao carregar: ${e.message}`;
                console.error(e);
            }
        }

        function mostrarTodos() {
            const grid = document.getElementById('produtos');
            grid.innerHTML = '';

            for (const p of catalogo.produtos) {
                const card = criar_card(p);
                grid.appendChild(card);
            }
        }

        function buscar() {
            if (!catalogo) return;
            const termo = document.getElementById('search').value.toLowerCase();
            const grid = document.getElementById('produtos');
            grid.innerHTML = '';

            let encontrados = 0;
            for (const p of catalogo.produtos) {
                if (termo === '' ||
                    p.descricao.toLowerCase().includes(termo) ||
                    p.categoria.toLowerCase().includes(termo) ||
                    p.codigos.some(c => c.toLowerCase().includes(termo))) {
                    const card = criar_card(p);
                    grid.appendChild(card);
                    encontrados++;
                    if (encontrados >= 100) break;
                }
            }

            if (encontrados === 0) {
                const msg = document.createElement('p');
                msg.style.cssText = 'grid-column: 1/-1; text-align: center;';
                msg.textContent = 'Nenhum produto encontrado';
                grid.appendChild(msg);
            }
        }

        function criar_card(p) {
            const div = document.createElement('div');
            div.className = 'produto-card';

            // Imagem
            const imgDiv = document.createElement('div');
            imgDiv.className = 'produto-imagem';
            if (p.imagem && (p.imagem.startsWith('/') || p.imagem.startsWith('https://'))) {
                const img = document.createElement('img');
                img.src = p.imagem;
                img.alt = p.descricao;
                img.loading = 'lazy';
                imgDiv.appendChild(img);
            } else {
                imgDiv.style.cssText = 'background: #f0f0f0; display: flex; align-items: center; justify-content: center;';
                imgDiv.textContent = 'Sem foto';
            }
            div.appendChild(imgDiv);

            // Info
            const info = document.createElement('div');
            info.className = 'produto-info';

            const h3 = document.createElement('h3');
            h3.textContent = p.descricao;
            info.appendChild(h3);

            const categoria = document.createElement('p');
            categoria.className = 'categoria';
            categoria.textContent = p.categoria;
            info.appendChild(categoria);

            if (p.marca) {
                const marca = document.createElement('p');
                marca.className = 'marca';
                marca.textContent = p.marca;
                info.appendChild(marca);
            }

            if (p.preco) {
                const preco = document.createElement('p');
                preco.className = 'preco';
                preco.textContent = `R$ ${p.preco.toFixed(2)}`;
                info.appendChild(preco);
            }

            const codigos = document.createElement('p');
            codigos.className = 'codigos';
            codigos.textContent = `Códigos: ${p.codigos.join(', ')}`;
            info.appendChild(codigos);

            div.appendChild(info);
            return div;
        }

        window.addEventListener('load', carregar);

        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.target.id === 'search') buscar();
        });
    </script>
</body>
</html>
