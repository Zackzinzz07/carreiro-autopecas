# Site = landing (index.html + assets/ da raiz) + catálogo estático (publico/, gerado por
# `python -m catalogo.scripts.gerar_estatico`). O Netlify só junta as duas partes: a landing
# continua sendo editada na raiz e o catálogo é regerado localmente (banco e fotos não vão pro git).
[build]
  publish = "publico"
  command = "cp index.html publico/index.html && cp -r assets publico/"

# Fotos têm o hash do conteúdo no nome: nunca mudam.
[[headers]]
  for = "/fotos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/catalogo/produtos.json"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
